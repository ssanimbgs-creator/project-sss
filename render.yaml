# LoveNest needs a persistent disk because it stores encrypted room history locally.
services:
  - type: web
    name: lovenest
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: lovenest-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
